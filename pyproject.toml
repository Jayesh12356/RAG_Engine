[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-chatbot"
version = "0.1.0"
description = "Configurable IT Helpdesk RAG System"
requires-python = ">=3.11"
# Compatible-release pins keep us on a known-working minor while still
# accepting safe patch-level upgrades. Bump the lower bound when you
# verify a new minor.
dependencies = [
    "fastapi~=0.115",
    "python-multipart~=0.0.20",
    "uvicorn~=0.32",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "structlog~=24.4",
    "openai~=1.55",
    "cohere~=5.13",
    # Keep within a tested API range; vector_store includes compat for query_points/search.
    "qdrant-client>=1.12,<2.0",
    "pymilvus~=2.4",
    "sqlalchemy~=2.0",
    "asyncpg~=0.30",
    "aiomysql~=0.2",
    "greenlet~=3.1",
    "pymupdf~=1.24",
    "pytesseract~=0.3.13",
    "pillow~=10.4",
    "pdf2image~=1.17",
    "langchain-text-splitters~=0.3",
    "tenacity~=9.0",
    "rank_bm25~=0.2.2",
    "reportlab~=4.2",
    # Universal document ingestion (Office/CSV/HTML/text/encoding sniffing)
    "python-docx~=1.1",
    "python-pptx~=1.0",
    "openpyxl~=3.1",
    "xlrd~=2.0",
    "pandas~=2.2",
    "beautifulsoup4~=4.12",
    "markdown~=3.7",
    "chardet~=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "httpx~=0.27",
    "aiosqlite~=0.20",
    "ruff~=0.7",
    "black~=24.10",
    "mypy~=1.13",
]
# Optional: local cross-encoder rerank fallback when Cohere is unreachable.
# `pip install -e ".[local-rerank]"` pulls in sentence-transformers (and torch).
local-rerank = [
    "sentence-transformers>=3.0,<5.0",
]
# Optional: OpenTelemetry tracing for FastAPI + per-stage spans.
# `pip install -e ".[otel]"` pulls in OpenTelemetry SDK + FastAPI auto-instrumentation.
otel = [
    "opentelemetry-api~=1.27",
    "opentelemetry-sdk~=1.27",
    "opentelemetry-instrumentation-fastapi~=0.48b0",
    "opentelemetry-exporter-otlp-proto-http~=1.27",
]
# Optional: rate limiting via slowapi.
rate-limit = [
    "slowapi~=0.1",
]
# Optional: PII redaction via Microsoft Presidio.
pii = [
    "presidio-analyzer~=2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["roadmap", "data", "scripts/manual"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = [
    "E501",    # long lines (black handles wrapping)
    "B008",    # FastAPI Depends/Query/Header default-arg pattern
    "PLC0415", # lazy/conditional imports are a deliberate plugin pattern
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "PLR2004", "F401", "F403", "E402"]
"scripts/**/*.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "(roadmap|data|scripts/manual)"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_unreachable = false
strict_optional = true
files = ["app"]
exclude = "(tests|roadmap|data|scripts/manual)"

# Legacy modules carry chronic typing debt (SQLAlchemy declarative,
# qdrant-client invariance, openai message types, OCR/Pillow stubs). The
# new modules added in this upgrade are fully typed. Per-module overrides
# below relax the gate on legacy code so ``mypy app/`` exits 0 without
# masking new regressions.
[[tool.mypy.overrides]]
module = [
    "app.api.routes",
    "app.chat.session",
    "app.db.relational",
    "app.db.vector_store",
    "app.ingestion.ocr_parser",
    "app.ingestion.sparse",
    "app.llm.client",
]
ignore_errors = true
