<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RAG Engine — Offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: radial-gradient(circle at top, #14182a 0%, #05060c 80%);
        color: #f0f3ff;
      }
      .shell {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        border-radius: 24px;
        background: rgba(20, 24, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(24px);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: rgba(240, 243, 255, 0.7);
        font-size: 14px;
      }
      button {
        margin-top: 24px;
        padding: 10px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #7c5cff, #3ecbff);
        color: #0a0d14;
        font-weight: 600;
        border: 0;
        cursor: pointer;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #f9b14b;
        margin-right: 8px;
        vertical-align: middle;
        box-shadow: 0 0 0 4px rgba(249, 177, 75, 0.18);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1><span class="dot"></span>You're offline</h1>
        <p>
          We can't reach the RAG Engine right now. Reconnect to the network and try again — your
          drafts and bookmarks remain saved on this device.
        </p>
        <button onclick="location.reload()">Retry</button>
      </section>
    </main>
  </body>
</html>
